<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Relatórios{% endblock %}</title>
<style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    nav a { margin-right: 16px; font-size: 14px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; font-size: 14px; }
    button, .botao { margin-top: 16px; padding: 8px 16px; cursor: pointer; background: #2c5aa0; color: #fff; border: none; border-radius: 4px; font-size: 14px; text-decoration: none; display: inline-block; }
    .secao { margin-top: 28px; padding-top: 16px; border-top: 1px solid #ddd; }
    .msg-sucesso { background: #e6f4ea; color: #1e7e34; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; }
    .foto-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .foto-lista img { width: 120px; height: 120px; object-fit: cover; border: 1px solid #ccc; border-radius: 4px; display: block; }
    .foto-item { cursor: grab; border: 2px solid transparent; border-radius: 4px; }
    .foto-item:active { cursor: grabbing; }
    .foto-fantasma { opacity: 0.4; border: 2px dashed #2c5aa0; }
</style>
</head>
<body>
    <nav>
        <a href="{% url 'checklist:novo' %}">+ Novo Checklist</a>
        <a href="{% url 'checklist:buscar' %}">Buscar Checklists</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="msg-sucesso">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block conteudo %}{% endblock %}
</body>
</html>
