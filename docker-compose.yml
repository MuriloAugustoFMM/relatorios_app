services:
  db:
    image: postgres:16
    container_name: relatorios_db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-relatorios}
      POSTGRES_USER: ${DB_USER:-relatorios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-relatorios}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-relatorios}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: relatorios_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py ensure_bucket &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  static_volume: